<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECT正逆问题与病态性</title>
    <style>
        body {
            font-family: "Microsoft YaHei", sans-serif;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            width: 90%;
            max-width: 1000px;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 10px;
            font-size: 36px;
        }
        p.subtitle {
            color: #7f8c8d;
            margin-bottom: 40px;
            font-size: 22px;
        }
        .diagram-container {
            display: flex;
            flex-direction: column;
            gap: 40px;
            align-items: center;
        }
        .process-row {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            position: relative;
        }
        .box {
            width: 220px;
            padding: 20px;
            border-radius: 12px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.3s ease;
        }
        .box-high {
            background: #eaf2f8;
            border: 2px solid #3498db;
        }
        .box-low {
            background: #f4f6f7;
            border: 2px solid #7f8c8d;
        }
        .box-title {
            font-weight: bold;
            font-size: 24px;
            margin-bottom: 10px;
            color: #2c3e50;
        }
        .box-desc {
            font-size: 18px;
            color: #7f8c8d;
        }
        .arrow-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0 20px;
            position: relative;
        }
        .arrow-line {
            height: 4px;
            width: 100%;
            background: #bdc3c7;
            position: relative;
            border-radius: 2px;
        }
        .arrow-head {
            position: absolute;
            right: -2px;
            top: -6px;
            width: 0; 
            height: 0; 
            border-top: 8px solid transparent;
            border-bottom: 8px solid transparent;
            border-left: 12px solid #bdc3c7;
        }
        .arrow-label {
            margin-bottom: 10px;
            font-weight: bold;
            color: #34495e;
            font-size: 22px;
        }
        .arrow-sub {
            font-size: 18px;
            color: #95a5a6;
            background: white;
            padding: 2px 8px;
            border-radius: 10px;
            border: 1px solid #eee;
        }
        
        /* Specific Styles for Inverse Problem */
        .inverse-arrow .arrow-line {
            background: linear-gradient(90deg, #2980b9 0%, #154360 100%);
            height: 6px;
        }
        .inverse-arrow .arrow-head {
            border-left-color: #154360;
        }
        
        /* Grid Visualization */
        .grid-viz {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 2px;
            width: 80px;
            height: 80px;
            margin-bottom: 10px;
        }
        .grid-cell {
            background: #d6eaf8;
            border-radius: 2px;
        }
        .grid-cell.active {
            background: #3498db;
        }
        
        /* Data Visualization */
        .data-viz {
            display: flex;
            gap: 4px;
            margin-bottom: 10px;
        }
        .data-bar {
            width: 8px;
            background: #5dade2;
            border-radius: 2px;
            align-self: flex-end;
        }

        /* Challenges Tags */
        .challenges {
            display: flex;
            gap: 15px;
            margin-top: 10px;
        }
        .tag {
            font-size: 16px;
            padding: 4px 12px;
            border-radius: 20px;
            color: white;
            font-weight: bold;
        }
        .tag-red { background: #154360; }
        .tag-orange { background: #2471a3; }
        .tag-purple { background: #2980b9; }

        /* Animation */
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        .animate-pulse {
            animation: pulse 2s infinite ease-in-out;
        }
        
        /* Question Mark for Ill-posed */
        .question-mark {
            position: absolute;
            top: -10px;
            right: -10px;
            background: #2c3e50;
            color: white;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            font-size: 16px;
            line-height: 24px;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

    </style>
</head>
<body>

<div class="card">
    <h1>ECT 成像的正逆问题</h1>
    <p class="subtitle">从物理场映射到图像重构的挑战</p>

    <div class="diagram-container">
        
        <!-- Forward Problem -->
        <div class="process-row">
            <!-- Input: Permittivity -->
            <div class="box box-high">
                <div class="grid-viz">
                    <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell active"></div><div class="grid-cell"></div>
                    <div class="grid-cell"></div><div class="grid-cell active"></div><div class="grid-cell active"></div><div class="grid-cell"></div>
                    <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell active"></div><div class="grid-cell"></div>
                    <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
                </div>
                <div class="box-title">介电常数分布 &epsilon;</div>
                <div class="box-desc">高维 / 空间分布</div>
            </div>

            <!-- Arrow -->
            <div class="arrow-section">
                <div class="arrow-label">正问题 (Forward)</div>
                <div class="arrow-line"><div class="arrow-head"></div></div>
                <div class="arrow-sub" style="margin-top: 5px;">物理场计算 / 麦克斯韦方程</div>
            </div>

            <!-- Output: Capacitance -->
            <div class="box box-low">
                <div class="data-viz" style="height: 60px;">
                    <div class="data-bar" style="height: 40%;"></div>
                    <div class="data-bar" style="height: 80%;"></div>
                    <div class="data-bar" style="height: 60%;"></div>
                    <div class="data-bar" style="height: 30%;"></div>
                    <div class="data-bar" style="height: 90%;"></div>
                    <div class="data-bar" style="height: 50%;"></div>
                </div>
                <div class="box-title">电容数据 C</div>
                <div class="box-desc">低维 / 边界测量</div>
            </div>
        </div>

        <!-- Inverse Problem -->
        <div class="process-row">
            <!-- Input: Capacitance -->
            <div class="box box-low">
                <div class="data-viz" style="height: 60px;">
                    <div class="data-bar" style="height: 40%;"></div>
                    <div class="data-bar" style="height: 80%;"></div>
                    <div class="data-bar" style="height: 60%;"></div>
                    <div class="data-bar" style="height: 30%;"></div>
                    <div class="data-bar" style="height: 90%;"></div>
                    <div class="data-bar" style="height: 50%;"></div>
                </div>
                <div class="box-title">电容数据 C</div>
                <div class="box-desc">输入：测量值 + 噪声</div>
            </div>

            <!-- Arrow -->
            <div class="arrow-section inverse-arrow">
                <div class="arrow-label" style="color: #154360;">逆问题 (Inverse)</div>
                <div class="arrow-line"><div class="arrow-head"></div></div>
                <div class="arrow-sub" style="margin-top: 5px; color: #154360; font-weight: bold;">图像重构算法</div>
                
                <!-- Challenges Tags -->
                <div class="challenges">
                    <div class="tag tag-red animate-pulse">病态性 (Ill-posed)</div>
                    <div class="tag tag-orange">非线性 (Non-linear)</div>
                    <div class="tag tag-purple">欠定性 (Under-determined)</div>
                </div>
            </div>

            <!-- Output: Permittivity (Reconstructed) -->
            <div class="box box-high" style="border-style: dashed;">
                <div class="question-mark">?</div>
                <div class="grid-viz" style="opacity: 0.7;">
                    <div class="grid-cell" style="background:#a9cce3"></div><div class="grid-cell"></div><div class="grid-cell active" style="opacity:0.6"></div><div class="grid-cell"></div>
                    <div class="grid-cell"></div><div class="grid-cell active" style="opacity:0.8"></div><div class="grid-cell active" style="opacity:0.5"></div><div class="grid-cell"></div>
                    <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell active" style="opacity:0.7"></div><div class="grid-cell"></div>
                    <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
                </div>
                <div class="box-title">重构图像 &epsilon;'</div>
                <div class="box-desc">求解困难：解不唯一 / 不稳定</div>
            </div>
        </div>

    </div>
</div>

</body>
</html>
