<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>边缘电场成像机理</title>
    <style>
        body {
            font-family: "Microsoft YaHei", sans-serif;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            width: 90%;
            max-width: 1100px;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 30px;
            font-size: 32px;
        }
        .container {
            display: flex;
            justify-content: space-around;
            align-items: flex-start;
        }
        .scene {
            flex: 1;
            margin: 0 10px;
            background: #fafafa;
            border-radius: 10px;
            padding: 15px;
            border: 1px solid #eee;
        }
        .scene-title {
            font-weight: bold;
            color: #34495e;
            margin-bottom: 15px;
            display: block;
            font-size: 24px;
        }
        .description {
            font-size: 18px;
            color: #7f8c8d;
            margin-top: 10px;
            text-align: left;
            line-height: 1.5;
        }
        .highlight {
            color: #e74c3c;
            font-weight: bold;
        }
        /* Animation for field lines */
        .field-line {
            stroke-dasharray: 10;
            animation: dash 20s linear infinite;
        }
        @keyframes dash {
            to {
                stroke-dashoffset: -500;
            }
        }
    </style>
</head>
<body>

<div class="card">
    <h1>边缘电场成像与感知机理</h1>
    
    <div class="container">
        <!-- Scene 1: Free Space -->
        <div class="scene">
            <span class="scene-title">1. 自由空间 (无扰动)</span>
            <svg width="250" height="200" viewBox="0 0 250 200">
                <!-- Ground/Sensor -->
                <rect x="0" y="180" width="250" height="20" fill="#ecf0f1"/>
                <!-- Electrodes -->
                <rect x="50" y="175" width="40" height="5" fill="#e67e22"/>
                <text x="70" y="195" text-anchor="middle" font-size="14">Tx</text>
                <rect x="160" y="175" width="40" height="5" fill="#e67e22"/>
                <text x="180" y="195" text-anchor="middle" font-size="14">Rx</text>
                
                <!-- Field Lines (Normal) -->
                <g stroke="#3498db" stroke-width="1.5" fill="none" opacity="0.6">
                    <path class="field-line" d="M 70 175 Q 125 100 180 175" />
                    <path class="field-line" d="M 70 175 Q 125 60 180 175" />
                    <path class="field-line" d="M 70 175 Q 125 20 180 175" />
                </g>
            </svg>
            <div class="description">
                电场线在电极间形成拱形分布，互电容保持基准值 C<sub>0</sub>。
            </div>
        </div>

        <!-- Scene 2: Proximity -->
        <div class="scene">
            <span class="scene-title">2. 接近觉 (Proximity)</span>
            <svg width="250" height="200" viewBox="0 0 250 200">
                <!-- Ground/Sensor -->
                <rect x="0" y="180" width="250" height="20" fill="#ecf0f1"/>
                <!-- Electrodes -->
                <rect x="50" y="175" width="40" height="5" fill="#e67e22"/>
                <text x="70" y="195" text-anchor="middle" font-size="14">Tx</text>
                <rect x="160" y="175" width="40" height="5" fill="#e67e22"/>
                <text x="180" y="195" text-anchor="middle" font-size="14">Rx</text>
                
                <!-- Object (Finger) Approaching -->
                <circle cx="125" cy="50" r="25" fill="#95a5a6" opacity="0.8"/>
                <text x="125" y="55" text-anchor="middle" fill="white" font-size="14">物体</text>
                <path d="M 125 30 L 125 45" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrow)"/>

                <!-- Field Lines (Distorted - Attracted to object) -->
                <g stroke="#e74c3c" stroke-width="1.5" fill="none" opacity="0.7">
                    <path class="field-line" d="M 70 175 Q 125 100 180 175" stroke="#3498db" opacity="0.3"/> <!-- Original ghost -->
                    
                    <!-- Lines bending towards object -->
                    <path class="field-line" d="M 70 175 Q 90 80 110 60" /> <!-- To object -->
                    <path class="field-line" d="M 140 60 Q 160 80 180 175" /> <!-- From object -->
                    
                    <path class="field-line" d="M 70 175 Q 125 110 180 175" /> <!-- Lower line less affected -->
                </g>
            </svg>
            <div class="description">
                物体进入边缘场范围，介电常数 &epsilon;<sub>x</sub> 改变电场分布。部分电场线被物体“吸引”或阻断，导致互电容变化 &Delta;C。
                <br><span class="highlight">应用：预接触安全检测、手势识别。</span>
            </div>
        </div>

        <!-- Scene 3: Tactile -->
        <div class="scene">
            <span class="scene-title">3. 触觉 (Tactile)</span>
            <svg width="250" height="200" viewBox="0 0 250 200">
                <!-- Ground/Sensor -->
                <rect x="0" y="180" width="250" height="20" fill="#ecf0f1"/>
                <!-- Electrodes -->
                <rect x="50" y="175" width="40" height="5" fill="#e67e22"/>
                <text x="70" y="195" text-anchor="middle" font-size="14">Tx</text>
                <rect x="160" y="175" width="40" height="5" fill="#e67e22"/>
                <text x="180" y="195" text-anchor="middle" font-size="14">Rx</text>
                
                <!-- Object Touching -->
                <rect x="100" y="160" width="50" height="20" fill="#95a5a6" opacity="0.9"/>
                <text x="125" y="175" text-anchor="middle" fill="white" font-size="14">接触</text>

                <!-- Field Lines (Highly Distorted) -->
                <g stroke="#e74c3c" stroke-width="1.5" fill="none" opacity="0.9">
                    <!-- Most lines go through the object -->
                    <path class="field-line" d="M 70 175 Q 85 170 100 170" />
                    <path class="field-line" d="M 150 170 Q 165 170 180 175" />
                    
                    <!-- Very few high lines -->
                    <path d="M 70 175 Q 125 140 180 175" stroke-dasharray="2,2"/>
                </g>
            </svg>
            <div class="description">
                物体直接接触或按压表面。电场路径被显著改变，电容变化量达到峰值。
                <br><span class="highlight">应用：接触位置定位、压力/形状重构。</span>
            </div>
        </div>
    </div>
</div>

</body>
</html>
