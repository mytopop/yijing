<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AG95 & Tashan Sensor Process Flow</title>
    <style>
        :root {
            --primary-blue: #1565c0;
            --light-blue: #e3f2fd;
            --border-blue: #90caf9;
            --text-dark: #2c3e50;
            --text-light: #546e7a;
            --bg-color: #f5f9fc;
            --card-bg: #ffffff;
        }

        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-dark);
            margin: 0;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 {
            color: var(--primary-blue);
            margin-bottom: 15px;
            font-size: 36px; /* Increased size */
            text-align: center;
            font-weight: bold;
        }

        .subtitle {
            color: var(--text-light);
            margin-bottom: 60px;
            font-size: 20px; /* Increased size */
            text-align: center;
            max-width: 900px;
        }

        /* Flowchart Container */
        .flow-container {
            display: flex;
            justify-content: center;
            align-items: stretch;
            gap: 25px;
            width: 100%;
            max-width: 1400px; /* Increased width to accommodate larger text */
        }

        /* Individual Step Card */
        .step-card {
            background: var(--card-bg);
            border: 1px solid var(--border-blue);
            border-top: 5px solid var(--primary-blue);
            border-radius: 10px;
            padding: 25px;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 4px 15px rgba(21, 101, 192, 0.08);
            transition: transform 0.3s ease;
            min-width: 240px;
        }

        .step-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(21, 101, 192, 0.15);
        }

        /* Step Header */
        .step-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            width: 100%;
            border-bottom: 1px dashed #eee;
            padding-bottom: 15px;
        }

        .step-number {
            background-color: var(--primary-blue);
            color: white;
            width: 36px; /* Increased size */
            height: 36px; /* Increased size */
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px; /* Increased size */
        }

        .step-title {
            font-size: 24px; /* Increased size */
            font-weight: bold;
            color: var(--primary-blue);
        }

        /* Visual Area within Card */
        .visual-area {
            width: 100%;
            height: 180px; /* Slightly taller */
            background-color: var(--light-blue);
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Description Text */
        .step-desc {
            font-size: 16px; /* Increased size */
            color: var(--text-light);
            line-height: 1.6;
            text-align: left;
            width: 100%;
        }

        /* Arrow Connector */
        .arrow-connector {
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary-blue);
            font-size: 32px; /* Increased size */
            opacity: 0.5;
        }

        /* SVG Styles */
        svg {
            width: 100%;
            height: 100%;
        }
        
        text {
            font-family: 'Microsoft YaHei', sans-serif;
        }

        /* Specific SVG Elements */
        .gripper-path { fill: #546e7a; }
        .sensor-highlight { fill: #ef5350; }
        .object-highlight { fill: #ffca28; opacity: 0.8; }
        
        .chart-line { fill: none; stroke: #1565c0; stroke-width: 2; }
        .chart-grid { stroke: #bbdefb; stroke-width: 1; stroke-dasharray: 3,3; }
        
        .nn-node { fill: white; stroke: #1565c0; stroke-width: 2; }
        .nn-link { stroke: #90caf9; stroke-width: 1; }
        
        .result-box { fill: white; stroke: #4caf50; stroke-width: 2; rx: 4; }
        .result-text { font-size: 14px; fill: #2e7d32; font-weight: bold; } /* Increased size */

    </style>
</head>
<body>

    <h1>AG95 夹爪与 Tashan 触觉感知系统流程</h1>
    <div class="subtitle">基于电容触觉传感器 (Tashan) 的机器人抓取与物体分类闭环系统</div>

    <div class="flow-container">
        
        <!-- Step 1 -->
        <div class="step-card">
            <div class="step-header">
                <div class="step-number">1</div>
                <div class="step-title">动态抓取</div>
            </div>
            <div class="visual-area">
                <!-- Simplified Static Gripper SVG -->
                <svg viewBox="0 0 200 160">
                    <!-- Base -->
                    <rect x="80" y="10" width="40" height="20" fill="#546e7a"/>
                    <!-- Left Arm -->
                    <path d="M80 20 L60 80" stroke="#78909c" stroke-width="6" stroke-linecap="round"/>
                    <rect x="50" y="80" width="15" height="50" fill="#26a69a" rx="2"/> <!-- Teal Finger -->
                    <rect x="62" y="90" width="3" height="12" fill="#ef5350"/> <!-- Sensor -->
                    <rect x="62" y="110" width="3" height="12" fill="#ef5350"/> <!-- Sensor -->
                    
                    <!-- Right Arm -->
                    <path d="M120 20 L140 80" stroke="#78909c" stroke-width="6" stroke-linecap="round"/>
                    <rect x="135" y="80" width="15" height="50" fill="#26a69a" rx="2"/> <!-- Teal Finger -->
                    <rect x="135" y="90" width="3" height="12" fill="#ef5350"/> <!-- Sensor -->
                    <rect x="135" y="110" width="3" height="12" fill="#ef5350"/> <!-- Sensor -->

                    <!-- Object -->
                    <rect x="90" y="100" width="20" height="30" fill="#ffca28" opacity="0.8"/>
                    
                    <!-- Field Lines -->
                    <path d="M65 96 Q 100 90 135 96" fill="none" stroke="#1565c0" stroke-width="1" stroke-dasharray="2,2"/>
                    <path d="M65 116 Q 100 110 135 116" fill="none" stroke="#1565c0" stroke-width="1" stroke-dasharray="2,2"/>
                    
                    <text x="100" y="150" text-anchor="middle" font-size="14" fill="#546e7a">AG95 + Tashan</text>
                </svg>
            </div>
            <div class="step-desc">
                <strong>执行动作：</strong> AG95 夹爪闭合，接触并挤压物体。<br>
                <strong>关键组件：</strong> 集成 Tashan 电容式触觉传感器的指尖模块。
            </div>
        </div>

        <div class="arrow-connector">➜</div>

        <!-- Step 2 -->
        <div class="step-card">
            <div class="step-header">
                <div class="step-number">2</div>
                <div class="step-title">数据采集</div>
            </div>
            <div class="visual-area">
                <!-- Data Chart SVG -->
                <svg viewBox="0 0 200 160">
                    <!-- Grid -->
                    <line x1="20" y1="20" x2="20" y2="140" class="chart-grid"/>
                    <line x1="20" y1="140" x2="180" y2="140" class="chart-grid"/>
                    
                    <!-- Waveforms -->
                    <path d="M20 120 C 50 120, 60 40, 100 50 S 150 80, 180 60" fill="none" stroke="#1565c0" stroke-width="2"/>
                    <path d="M20 130 C 50 130, 70 90, 110 100 S 160 110, 180 90" fill="none" stroke="#42a5f5" stroke-width="2" stroke-dasharray="4,2"/>
                    
                    <text x="100" y="155" text-anchor="middle" font-size="12" fill="#546e7a">Time (t)</text>
                    <text x="10" y="80" text-anchor="middle" font-size="12" fill="#546e7a" transform="rotate(-90 10,80)">Capacitance (C)</text>
                </svg>
            </div>
            <div class="step-desc">
                <strong>信号特征：</strong> 记录闭合过程中的电容变化序列。<br>
                <strong>数据类型：</strong> 多通道时间序列数据 (Time-series)。
            </div>
        </div>

        <div class="arrow-connector">➜</div>

        <!-- Step 3 -->
        <div class="step-card">
            <div class="step-header">
                <div class="step-number">3</div>
                <div class="step-title">算法训练</div>
            </div>
            <div class="visual-area">
                <!-- Neural Network SVG -->
                <svg viewBox="0 0 200 160">
                    <!-- Links -->
                    <g class="nn-link">
                        <line x1="40" y1="40" x2="100" y2="60"/>
                        <line x1="40" y1="40" x2="100" y2="100"/>
                        <line x1="40" y1="80" x2="100" y2="60"/>
                        <line x1="40" y1="80" x2="100" y2="100"/>
                        <line x1="40" y1="120" x2="100" y2="60"/>
                        <line x1="40" y1="120" x2="100" y2="100"/>
                        
                        <line x1="100" y1="60" x2="160" y2="80"/>
                        <line x1="100" y1="100" x2="160" y2="80"/>
                    </g>
                    
                    <!-- Nodes Layer 1 -->
                    <circle cx="40" cy="40" r="8" class="nn-node"/>
                    <circle cx="40" cy="80" r="8" class="nn-node"/>
                    <circle cx="40" cy="120" r="8" class="nn-node"/>
                    
                    <!-- Nodes Layer 2 -->
                    <circle cx="100" cy="60" r="8" class="nn-node"/>
                    <circle cx="100" cy="100" r="8" class="nn-node"/>
                    
                    <!-- Nodes Layer 3 -->
                    <circle cx="160" cy="80" r="8" class="nn-node" fill="#1565c0"/>
                    
                    <text x="100" y="145" text-anchor="middle" font-size="14" fill="#546e7a">Deep Learning</text>
                </svg>
            </div>
            <div class="step-desc">
                <strong>模型构建：</strong> 使用采集的数据集训练深度学习模型。<br>
                <strong>核心任务：</strong> 特征提取与模式识别。
            </div>
        </div>

        <div class="arrow-connector">➜</div>

        <!-- Step 4 -->
        <div class="step-card">
            <div class="step-header">
                <div class="step-number">4</div>
                <div class="step-title">物体分类</div>
            </div>
            <div class="visual-area">
                <!-- Classification Result SVG -->
                <svg viewBox="0 0 200 160">
                    <rect x="40" y="30" width="120" height="30" class="result-box" stroke="#4caf50"/>
                    <text x="100" y="50" text-anchor="middle" class="result-text">Material: Soft</text>
                    
                    <rect x="40" y="70" width="120" height="30" class="result-box" stroke="#1565c0"/>
                    <text x="100" y="90" text-anchor="middle" class="result-text" fill="#0d47a1">Shape: Cube</text>
                    
                    <rect x="40" y="110" width="120" height="30" class="result-box" stroke="#ff9800"/>
                    <text x="100" y="130" text-anchor="middle" class="result-text" fill="#e65100">Hardness: High</text>
                    
                    <!-- Removed the checkmark paths as requested -->
                </svg>
            </div>
            <div class="step-desc">
                <strong>输出结果：</strong> 实时识别物体的物理属性。<br>
                <strong>应用场景：</strong> 材质识别、硬度分类、物体抓取策略调整。
            </div>
        </div>

    </div>

</body>
</html>
