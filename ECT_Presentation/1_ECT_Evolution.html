<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ECT技术演进：从管道到皮肤</title>
    <style>
      body {
        font-family: "Microsoft YaHei", sans-serif;
        background-color: #f4f6f9;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }
      .card {
        background: white;
        padding: 40px;
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        text-align: center;
        max-width: 1000px;
        width: 90%;
      }
      h1 {
        color: #2c3e50;
        margin-bottom: 10px;
        font-size: 28px;
      }
      p.subtitle {
        color: #7f8c8d;
        margin-bottom: 40px;
        font-size: 16px;
      }
      .diagram-container {
        display: flex;
        justify-content: center;
        align-items: center;
        flex-wrap: wrap;
      }
      .panel {
        flex: 0 0 auto;
        width: 300px;
        padding: 10px;
        position: relative;
      }
      .arrow-container {
        width: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: #3498db;
        font-weight: bold;
      }
      .arrow {
        font-size: 40px;
        line-height: 1;
      }
      .label {
        font-weight: bold;
        margin-top: 20px;
        display: block;
        color: #34495e;
        font-size: 18px;
      }
      .desc {
        font-size: 14px;
        color: #95a5a6;
        margin-top: 5px;
        display: block;
      }
      svg {
        overflow: visible;
      }
      /* Animation for field lines */
      .field-line {
        stroke-dasharray: 10;
        animation: dash 30s linear infinite;
      }
      @keyframes dash {
        to {
          stroke-dashoffset: -1000;
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>ECT技术演进示意图</h1>
      <p class="subtitle">从工业密闭管道检测向机器人开放场域感知的迁移</p>

      <div class="diagram-container">
        <!-- Left Panel: Industrial ECT -->
        <div class="panel">
          <svg width="250" height="250" viewBox="0 0 250 250">
            <!-- Pipe Wall -->
            <circle
              cx="125"
              cy="125"
              r="100"
              fill="#ecf0f1"
              stroke="#bdc3c7"
              stroke-width="5"
            />

            <!-- Electrodes (Circular Array) -->
            <g id="electrodes-circle">
              <!-- Generating 8 electrodes -->
              <rect
                x="115"
                y="10"
                width="20"
                height="10"
                fill="#e67e22"
                transform="rotate(0 125 125)"
              />
              <rect
                x="115"
                y="10"
                width="20"
                height="10"
                fill="#e67e22"
                transform="rotate(45 125 125)"
              />
              <rect
                x="115"
                y="10"
                width="20"
                height="10"
                fill="#e67e22"
                transform="rotate(90 125 125)"
              />
              <rect
                x="115"
                y="10"
                width="20"
                height="10"
                fill="#e67e22"
                transform="rotate(135 125 125)"
              />
              <rect
                x="115"
                y="10"
                width="20"
                height="10"
                fill="#e67e22"
                transform="rotate(180 125 125)"
              />
              <rect
                x="115"
                y="10"
                width="20"
                height="10"
                fill="#e67e22"
                transform="rotate(225 125 125)"
              />
              <rect
                x="115"
                y="10"
                width="20"
                height="10"
                fill="#e67e22"
                transform="rotate(270 125 125)"
              />
              <rect
                x="115"
                y="10"
                width="20"
                height="10"
                fill="#e67e22"
                transform="rotate(315 125 125)"
              />
            </g>

            <!-- Internal Field Lines (Cross-sectional) -->
            <g stroke="#3498db" stroke-width="1.5" fill="none" opacity="0.6">
              <path class="field-line" d="M 125 25 Q 125 125 125 225" />
              <path class="field-line" d="M 25 125 Q 125 125 225 125" />
              <path class="field-line" d="M 54 54 Q 125 125 196 196" />
              <path class="field-line" d="M 196 54 Q 125 125 54 196" />
              <!-- Curves -->
              <path class="field-line" d="M 125 25 Q 180 125 125 225" />
              <path class="field-line" d="M 125 25 Q 70 125 125 225" />
            </g>

            <!-- Object inside -->
            <circle
              cx="140"
              cy="110"
              r="30"
              fill="#95a5a6"
              opacity="0.5"
              stroke="#7f8c8d"
              stroke-dasharray="4 2"
            />
            <text
              x="140"
              y="115"
              text-anchor="middle"
              font-size="10"
              fill="#2c3e50"
            >
              多相流
            </text>
          </svg>
          <span class="label">传统工业应用</span>
          <span class="desc">封闭圆形结构 / 内部成像</span>
        </div>

        <!-- Arrow -->
        <div class="arrow-container">
          <div class="arrow">➔</div>
          <div style="margin-top: 5px; font-size: 14px">机制迁移</div>
        </div>

        <!-- Right Panel: Robot Skin ECT -->
        <div class="panel">
          <svg width="250" height="250" viewBox="0 0 250 250">
            <!-- Robot Arm Surface -->
            <path
              d="M 25 200 Q 125 190 225 200"
              stroke="#bdc3c7"
              stroke-width="3"
              fill="none"
            />
            <rect
              x="25"
              y="200"
              width="200"
              height="30"
              fill="#ecf0f1"
              rx="5"
            />

            <!-- Electrodes (Planar Array) -->
            <g id="electrodes-planar">
              <rect x="40" y="195" width="30" height="5" fill="#e67e22" />
              <rect x="85" y="195" width="30" height="5" fill="#e67e22" />
              <rect x="130" y="195" width="30" height="5" fill="#e67e22" />
              <rect x="175" y="195" width="30" height="5" fill="#e67e22" />
            </g>

            <!-- Fringing Field Lines (Arching Up) -->
            <g stroke="#e74c3c" stroke-width="1.5" fill="none" opacity="0.7">
              <!-- Arcs between adjacent electrodes -->
              <path class="field-line" d="M 55 195 Q 77 140 100 195" />
              <path class="field-line" d="M 100 195 Q 122 140 145 195" />
              <path class="field-line" d="M 145 195 Q 167 140 190 195" />

              <!-- Higher Arcs (Cross-electrode) -->
              <path class="field-line" d="M 55 195 Q 100 80 145 195" />
              <path class="field-line" d="M 100 195 Q 145 80 190 195" />

              <!-- Very High Arcs -->
              <path class="field-line" d="M 55 195 Q 122 20 190 195" />
            </g>

            <!-- External Object -->
            <circle
              cx="125"
              cy="80"
              r="20"
              fill="#95a5a6"
              opacity="0.5"
              stroke="#7f8c8d"
              stroke-dasharray="4 2"
            />
            <text
              x="125"
              y="85"
              text-anchor="middle"
              font-size="10"
              fill="#2c3e50"
            >
              外部物体
            </text>
          </svg>
          <span class="label">机器人皮肤应用</span>
          <span class="desc">单面/开放结构 / 边缘场成像</span>
        </div>
      </div>
    </div>
  </body>
</html>
