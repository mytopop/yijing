<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>研究计划时间表</title>
    <style>
        body {
            font-family: "SimSun", serif;
            margin: 20px;
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
        }
        .container {
            background-color: white;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            border-radius: 8px;
        }
        table {
            border-collapse: collapse;
            width: 1000px;
            margin: 0 auto;
        }
        th, td {
            border: 1px solid #999;
            padding: 10px;
            text-align: center;
            font-size: 10.5pt;
        }
        /* Header styling */
        th {
            background-color: #fff;
            font-weight: normal;
        }
        .header-row-1 th {
            border-bottom: none;
        }
        .header-row-2 th {
            border-top: none;
            font-weight: normal;
            font-size: 10.5pt;
        }
        
        /* Diagonal split cell */
        .diagonal-split {
            background: linear-gradient(to top right, transparent calc(50% - 1px), #999 calc(50% - 1px), #999 calc(50% + 1px), transparent calc(50% + 1px));
            position: relative;
            padding: 0 !important;
            width: 300px;
            height: 80px; /* Adjust as needed */
        }
        .diagonal-content {
            position: relative;
            width: 100%;
            height: 100%;
            display: block;
        }
        .text-top-right {
            position: absolute;
            top: 15px;
            right: 15px;
            text-align: right;
        }
        .text-bottom-left {
            position: absolute;
            bottom: 15px;
            left: 15px;
            text-align: left;
        }

        /* First column styling (body) */
        tbody td:first-child {
            text-align: center;
            font-weight: normal;
            width: 300px;
            background-color: #fff;
        }

        /* Bar colors */
        .bar-blue {
            background-color: #7da7d9;
        }
        .bar-orange {
            background-color: #f4cbad;
        }
        
        /* Title styling */
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>研究计划时间表 (2024-2027)</h2>
        <table>
            <thead>
                <tr class="header-row-1">
                    <th rowspan="2" class="diagonal-split">
                        <div class="diagonal-content">
                            <span class="text-top-right">执行周期</span>
                            <span class="text-bottom-left">主要任务内容</span>
                        </div>
                    </th>
                    <th colspan="6" style="border-bottom: 1px solid #999;">(2024年6月 - 2027年6月)</th>
                </tr>
                <tr class="header-row-2">
                    <th>2024<br>6月-12月</th>
                    <th>2025<br>1月-6月</th>
                    <th>2025<br>7月-12月</th>
                    <th>2026<br>1月-6月</th>
                    <th>2026<br>7月-12月</th>
                    <th>2027<br>1月-6月</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>仿真建模与结构优化</td>
                    <td class="bar-blue"></td>
                    <td></td>
                    <td></td>
                    <td></td>
                    <td></td>
                    <td></td>
                </tr>
                <tr>
                    <td>数据集构建与硬件准备</td>
                    <td></td>
                    <td class="bar-orange"></td>
                    <td></td>
                    <td></td>
                    <td></td>
                    <td></td>
                </tr>
                <tr>
                    <td>深度学习算法开发</td>
                    <td></td>
                    <td></td>
                    <td class="bar-blue"></td>
                    <td></td>
                    <td></td>
                    <td></td>
                </tr>
                <tr>
                    <td>Sim-to-Real 迁移与系统集成</td>
                    <td></td>
                    <td></td>
                    <td></td>
                    <td class="bar-orange"></td>
                    <td></td>
                    <td></td>
                </tr>
                <tr>
                    <td>实验验证与学术产出</td>
                    <td></td>
                    <td></td>
                    <td></td>
                    <td></td>
                    <td class="bar-blue"></td>
                    <td></td>
                </tr>
                <tr>
                    <td>学位论文与答辩</td>
                    <td></td>
                    <td></td>
                    <td></td>
                    <td></td>
                    <td></td>
                    <td class="bar-orange"></td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
